[package]
name = "tutor"
version = "0.1.0"
description = "Notes that turn into questions, and questions that come back just before you forget them"
authors = ["Tutor contributors"]
edition = "2024"

[lib]
# The `_lib` suffix keeps the library name distinct from the binary name,
# which Windows needs (https://github.com/rust-lang/cargo/issues/8519).
name = "tutor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-http = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# API keys for cloud models go in the system keychain, never in the database.
keyring = { version = "3", features = ["apple-native", "windows-native"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
# The built-in AI engine: downloading it, unpacking it, waiting for it to start.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["time", "sync"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
